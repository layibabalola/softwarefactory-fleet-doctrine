name: Bus drift alarm

# A red sealed-pin check on master is advisory until someone looks; writers on other machines do not run
# hooks/pre-push-bus-tests.py, so their pushes can redden master unseen (2026-10-17: 10.6 h red after
# bus 16ef646c). After each run of the workflows that carry the r45/R26 drift checks, this re-runs both
# checkers on the master tip and keeps ONE tracking issue open while either fails -- naming the commit
# that introduced the drift, its author and the exact approved refresh -- and closes it when green.
# It never refreshes (Law 1). One ubuntu job, no matrix: it alarms, it is not evidence.
on:
  workflow_run:
    workflows:
      - "R26 adoption ledger"
      - "R26 project disposition intake"
      - "Provider capacity governor contracts"
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: bus-drift-alarm-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  alarm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out master with full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: master
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"

      - name: Install locked checker dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-provider-capacity-governor.lock.txt

      - name: Run drift checkers and open, update or close the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/bus-drift-alarm.py --issue --repo "${{ github.repository }}"

name: R26 adoption ledger

on:
  pull_request:
    paths:
      - ".github/workflows/adoption-ledger.yml"
      - "capacity-control/PROJECT-ADOPTION-MATRIX.md"
      - "specs/**"
      - "tests/test_adoption_ledger.py"
      - "tools/check_adoption_ledger.py"
  push:
    branches: [master]
    paths:
      - ".github/workflows/adoption-ledger.yml"
      - "capacity-control/PROJECT-ADOPTION-MATRIX.md"
      - "specs/**"
      - "tests/test_adoption_ledger.py"
      - "tools/check_adoption_ledger.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r26-adoption-ledger-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidence:
    strategy:
      fail-fast: false
      # Exact project/spec drift is checked once on each PR. The complete matrix
      # runs only on canonical master and explicit landing verification.
      matrix: ${{ fromJSON(github.event_name == 'pull_request' && '{"os":["ubuntu-latest"],"python-version":["3.14"]}' || '{"os":["windows-latest","ubuntu-latest"],"python-version":["3.13","3.14"]}') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Check out full evidence history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run fail-closed ledger controls
        run: python -m unittest discover -s tests -p "test_adoption_ledger.py" -v

      - name: Verify the ledger against project-owned Git evidence
        run: python tools/check_adoption_ledger.py --treeish HEAD

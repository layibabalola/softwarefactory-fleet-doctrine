name: Fleet usage-control workbench

on:
  pull_request:
    paths:
      - ".github/workflows/fleet-usage-control.yml"
      - "capacity-control/**"
      - "requirements-provider-capacity-governor.txt"
      - "requirements-provider-capacity-governor.lock.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fleet-usage-control-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Check out candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pinned schema validator
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-provider-capacity-governor.lock.txt

      - name: Run runtime-extension negative controls
        run: python -m unittest discover -s capacity-control/tests -p "test_*.py" -v

      - name: Verify the closed zero-reserve project request queue
        run: python tools/check_zero_reserve_disposition_requests.py

      - name: Compile runtime-extension references
        run: python -m compileall -q capacity-control/reference

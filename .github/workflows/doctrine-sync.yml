name: Doctrine sync
on:
  push:
    branches: [master]
    paths:
      - 'tools/doctrine-sync*'
      - 'tools/fleet-sweep.mjs'
      - 'tools/fleet-membership*.mjs'
      - 'tools/Get-FleetHeartbeatStatus.ps1'
      - 'specs/*continuity*'
      - 'specs/*resumption*'
      - 'specs/*/cards.md'
      - 'examples/cards-v1.md'
      - 'tools/validate-cards*.mjs'
      - 'tools/traps-index*.mjs'
      - 'tools/tool-census*'
      - 'tools/factory/**'
      - 'hooks/**'
      - 'metrics/tool-census-baseline.json'
      - 'TRAPS-INDEX.md'
      - '.github/workflows/doctrine-sync.yml'
  pull_request:
    paths:
      - 'tools/doctrine-sync*'
      - 'tools/fleet-sweep.mjs'
      - 'tools/fleet-membership*.mjs'
      - 'tools/Get-FleetHeartbeatStatus.ps1'
      - 'specs/*continuity*'
      - 'specs/*resumption*'
      - 'specs/*/cards.md'
      - 'examples/cards-v1.md'
      - 'tools/validate-cards*.mjs'
      - 'tools/traps-index*.mjs'
      - 'tools/tool-census*'
      - 'tools/factory/**'
      - 'hooks/**'
      - 'metrics/tool-census-baseline.json'
      - 'TRAPS-INDEX.md'
      - '.github/workflows/doctrine-sync.yml'
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: doctrine-sync-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # traps-index.tests.mjs checks the index against TRAPS.md at the commit that last wrote
          # TRAPS-INDEX.md (git log), which a shallow clone cannot reach.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pinned acknowledgement and exact publication
        run: node tools/doctrine-sync.tests.mjs
      - name: Real member discovery and absent Cloudvore heartbeat
        run: node tools/fleet-membership.tests.mjs
      - name: R14 card validator fixtures and the bus card files
        run: |
          node tools/validate-cards.tests.mjs
          node tools/validate-cards.mjs
      - name: R14 TRAPS index fixtures (live partition and committed index)
        run: node tools/traps-index.tests.mjs
      - name: Shared-tool census fixtures (versions, marker sections, double registration, ratchet)
        run: node tools/tool-census.tests.mjs
      - name: Factory tools and refusing hooks (pin runner, check-doc-size tier tables, hooks)
        run: |
          python3 tools/factory/pin-runner.tests.py
          python3 tools/factory/check-doc-size.tests.py
          python3 hooks/hooks.tests.py
      - name: Shared-tool census against the live fleet (deadline schedule; UNMEASURED without the clones)
        # The census counts copies in the sibling project clones named in tools/tool-census.config.json.
        # A hosted runner holds only this repository, so the tool exits 3 (UNMEASURED) there: that is
        # reported as a warning annotation, never as a pass. Exit 1 (rose, or over the schedule's current
        # max) fails the job wherever the clones are visible (a fleet box, or the CLI run by hand).
        shell: bash
        run: |
          set +e
          node tools/tool-census.mjs --check
          rc=$?
          set -e
          if [ "$rc" -eq 3 ]; then
            echo "::warning title=tool-census UNMEASURED::the fleet clones are not visible on this runner; the deadline schedule was not checked here. Run 'node tools/tool-census.mjs --check' on a fleet box."
            exit 0
          fi
          exit "$rc"

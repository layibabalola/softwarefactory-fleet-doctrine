  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: doctrine-sync-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # traps-index.tests.mjs checks the index against TRAPS.md at the commit that last wrote
          # TRAPS-INDEX.md (git log), which a shallow clone cannot reach.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pinned acknowledgement and exact publication
        run: node tools/doctrine-sync.tests.mjs
      - name: Real member discovery and absent Cloudvore heartbeat
        run: node tools/fleet-membership.tests.mjs
      - name: R14 card validator fixtures and the bus card files
        run: |
          node tools/validate-cards.tests.mjs
          node tools/validate-cards.mjs
      - name: R14 TRAPS index fixtures (live partition and committed index)
        run: node tools/traps-index.tests.mjs
      - name: Shared-tool census fixtures (versions, marker sections, double registration, ratchet)
        run: node tools/tool-census.tests.mjs
      - name: Factory tools and refusing hooks (pin runner, check-doc-size tier tables, fleet scorecard + health, hooks)
        run: |
          python3 tools/factory/pin-runner.tests.py
          python3 tools/factory/init.tests.py
          python3 tools/factory/session-checkpoint.tests.py
          python3 tools/factory/check-doc-size.tests.py
          python3 tools/factory/session-start-auth.tests.py
          python3 tools/factory/fleet-scorecard.tests.py
          python3 hooks/hooks.tests.py
      - name: Shared-tool census - every view this runner can see (the 'bus' view always; fleet views UNMEASURED)
        # tools/tool-census.mjs rule 7: the baseline holds one count per root set. The 'bus' view counts
        # copies on this repository alone, so a hosted runner measures it and exit 1 refuses a duplicate
        # added here. Fleet views (sibling clones) are UNMEASURED on a hosted runner and are named, never
        # passed; exit 3 (no view measurable at all) stays a warning annotation.
        shell: bash
        run: |
          set +e
          node tools/tool-census.mjs --check
          rc=$?
          set -e
          if [ "$rc" -eq 3 ]; then
            echo "::warning title=tool-census UNMEASURED::no census view is measurable on this runner. Run 'node tools/tool-census.mjs --check' on a fleet box."
            exit 0
          fi
          exit "$rc"
      - name: Shared-tool census ratchet - the baseline never rises without a ruling entry
        # tools/tool-census.mjs rule 8: any loosening of the baseline since the push/PR base (a raised
        # total, a dropped view/root/family, a later or looser deadline) fails unless the same change adds
        # an entry to metrics/tool-census-rulings.json citing the owner ruling.
        shell: bash
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "no base revision (new branch or manual run): comparing with HEAD~1"
            BASE=HEAD~1
          fi
          node tools/tool-census.mjs --check-ratchet "$BASE"

name: Doctrine sync
on:
  push:
    branches: [master]
    paths:
      - 'tools/doctrine-sync*'
      - 'tools/fleet-sweep.mjs'
      - 'tools/fleet-membership*.mjs'
      - 'tools/Get-FleetHeartbeatStatus.ps1'
      - 'specs/*continuity*'
      - 'specs/*resumption*'
      - '.github/workflows/doctrine-sync.yml'
      - 'tools/traps-index.py'
      - 'tools/candidate-flow.py'
      - 'tools/kernel-e2e.py'
      - 'tests/test_traps_index.py'
      - 'tests/test_candidate_flow.py'
      - 'tests/test_kernel_e2e.py'
      - 'TRAPS.md'
      - 'TRAPS-INDEX.md'
      - 'ruling-candidates/**'
      - 'adjudications/**'
  pull_request:
    paths:
      - 'tools/doctrine-sync*'
      - 'tools/fleet-sweep.mjs'
      - 'tools/fleet-membership*.mjs'
      - 'tools/Get-FleetHeartbeatStatus.ps1'
      - 'specs/*continuity*'
      - 'specs/*resumption*'
      - '.github/workflows/doctrine-sync.yml'
      - 'tools/traps-index.py'
      - 'tools/candidate-flow.py'
      - 'tools/kernel-e2e.py'
      - 'tests/test_traps_index.py'
      - 'tests/test_candidate_flow.py'
      - 'tests/test_kernel_e2e.py'
      - 'TRAPS.md'
      - 'TRAPS-INDEX.md'
      - 'ruling-candidates/**'
      - 'adjudications/**'
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: doctrine-sync-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pinned acknowledgement and exact publication
        run: node tools/doctrine-sync.tests.mjs
      - name: Real member discovery and absent Cloudvore heartbeat
        run: node tools/fleet-membership.tests.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      # A generated enumeration that nothing checks will rot. This is that check.
      - name: TRAPS index is current
        run: python tools/traps-index.py --check
      # These suites otherwise run in no workflow at all: every other workflow names its test
      # files individually, so a new tests/ file is invisible to CI by default -- a capability
      # with no caller, which is the defect class this repo keeps paying for.
      # stdlib unittest, matching the repo convention (29 of 34 tests/) -- no pip install, so
      # this runs on a bare runner.
      - name: Derived-instrument regressions
        run: |
          python -m unittest discover -s tests -p "test_traps_index.py" -v
          python -m unittest discover -s tests -p "test_candidate_flow.py" -v
          python -m unittest discover -s tests -p "test_kernel_e2e.py" -v

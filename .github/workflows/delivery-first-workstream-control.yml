name: Delivery-first workstream controls

on:
  pull_request:
    paths:
      - ".github/workflows/delivery-first-workstream-control.yml"
      - "README.md"
      - "examples/delivery-first-lane-status-v1.json"
      - "ruling-candidates/delivery-first-workstream-control-r1.md"
      - "tests/test_delivery_first_lane_status.py"
      - "tools/check_delivery_first_lane_status.py"
  push:
    branches: [master]
    paths:
      - ".github/workflows/delivery-first-workstream-control.yml"
      - "README.md"
      - "examples/delivery-first-lane-status-v1.json"
      - "ruling-candidates/delivery-first-workstream-control-r1.md"
      - "tests/test_delivery_first_lane_status.py"
      - "tools/check_delivery_first_lane_status.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: delivery-first-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(github.event_name == 'pull_request' && '{"os":["ubuntu-latest"],"python-version":["3.14"]}' || '{"os":["windows-latest","ubuntu-latest"],"python-version":["3.13","3.14"]}') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Check out candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run delivery-first workstream controls
        run: python -m unittest discover -s tests -p "test_delivery_first_lane_status.py" -v

      - name: Verify the delivery-first bootstrap example
        run: python tools/check_delivery_first_lane_status.py examples/delivery-first-lane-status-v1.json --bootstrap

name: R26 project disposition intake

on:
  pull_request:
    paths:
      - ".github/workflows/disposition-intake.yml"
      - "capacity-control/PROJECT-ADOPTION-MATRIX.md"
      - "manifests/**"
      - "specs/**"
      - "tests/test_adoption_ledger.py"
      - "tests/test_adversarialllm_utilization_shadow_doctrine.py"
      - "tests/test_phase*_*.py"
      - "tools/check_adoption_ledger.py"
      - "tools/check_phase*.py"
  push:
    branches: [master]
    paths:
      - ".github/workflows/disposition-intake.yml"
      - "capacity-control/PROJECT-ADOPTION-MATRIX.md"
      - "manifests/**"
      - "specs/**"
      - "tests/test_adoption_ledger.py"
      - "tests/test_adversarialllm_utilization_shadow_doctrine.py"
      - "tests/test_phase*_*.py"
      - "tools/check_adoption_ledger.py"
      - "tools/check_phase*.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r26-disposition-intake-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidence:
    env:
      R26_REMOTE_AUTH_CONFIGURED: ${{ secrets.R26_CROSS_REPO_READ_TOKEN != '' }}
      R26_SCOPE_EVENT: ${{ github.event_name }}
      R26_SCOPE_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before || '' }}
    strategy:
      fail-fast: false
      # The historical disposition chain is expensive. One Ubuntu/Python 3.14
      # PR job catches candidate drift; the four-way matrix remains a landing
      # seam requirement on master and workflow_dispatch.
      matrix: ${{ fromJSON(github.event_name == 'pull_request' && '{"os":["ubuntu-latest"],"python-version":["3.14"]}' || '{"os":["windows-latest","ubuntu-latest"],"python-version":["3.13","3.14"]}') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out full evidence history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run phase-2 blocker controls
        run: python -m unittest discover -s tests -p "test_phase2_disposition_batch.py" -v

      - name: Run AdversarialLLM utilization-shadow doctrine controls
        run: python -m unittest discover -s tests -p "test_adversarialllm_utilization_shadow_doctrine.py" -v

      - name: Verify phase-2 blockers against frozen project evidence
        run: python tools/check_phase2_disposition_batch.py --treeish 990906b6ea861ca579e1336bcfe8f17dd80c83ae

      - name: Run phase-3 published-project distinction controls
        run: python -m unittest discover -s tests -p "test_phase3_disposition_batch.py" -v

      - name: Verify exact zero-authority phase-3 distinctions locally
        env:
          R26_REMOTE_GITHUB_TOKEN: ${{ secrets.R26_CROSS_REPO_READ_TOKEN }}
        run: python tools/check_phase3_disposition_batch.py --treeish 990906b6ea861ca579e1336bcfe8f17dd80c83ae ${{ env.R26_REMOTE_AUTH_CONFIGURED == 'true' && '--verify-remotes' || '' }}

      - name: Report unavailable remote verification authority
        if: env.R26_REMOTE_AUTH_CONFIGURED != 'true'
        run: echo "REMOTES NOT VERIFIED - R26_CROSS_REPO_READ_TOKEN is not configured"

      - name: Run phase-5 remaining-STALE reconciliation controls
        run: python -m unittest discover -s tests -p "test_phase5_stale_reconciliation.py" -v

      - name: Verify phase-5 zero-authority reconciliation locally
        env:
          R26_REMOTE_GITHUB_TOKEN: ${{ secrets.R26_CROSS_REPO_READ_TOKEN }}
        run: python tools/check_phase5_stale_reconciliation.py --treeish 990906b6ea861ca579e1336bcfe8f17dd80c83ae ${{ env.R26_REMOTE_AUTH_CONFIGURED == 'true' && '--verify-remotes' || '' }}

      - name: Report unavailable Adobe remote verification authority
        if: env.R26_REMOTE_AUTH_CONFIGURED != 'true'
        run: echo "ADOBE REMOTE NOT VERIFIED - R26_CROSS_REPO_READ_TOKEN is not configured"

      - name: Run phase-6 local candidate review receipt controls
        run: python -m unittest discover -s tests -p "test_phase6_candidate_reviews.py" -v

      - name: Verify phase-6 zero-authority review receipts
        run: python tools/check_phase6_candidate_reviews.py --treeish e7311e3038bbfeebe15cc10004f40b3795811659

      - name: Run phase-7 owner-publication request controls
        run: python -m unittest discover -s tests -p "test_phase7_owner_publication_requests.py" -v

      - name: Verify phase-7 request-only zero-authority packets
        run: python tools/check_phase7_owner_publication_requests.py --treeish e7311e3038bbfeebe15cc10004f40b3795811659

      - name: Run phase-8 linear integration controls
        run: python -m unittest discover -s tests -p "test_phase8_integration.py" -v

      - name: Verify phase-8 accepted-lineage integration
        run: python tools/check_phase8_integration.py --treeish e7311e3038bbfeebe15cc10004f40b3795811659

      - name: Run phase-9 manifest integration controls
        run: python -m unittest discover -s tests -p "test_phase9_integration.py" -v

      - name: Verify phase-9 accepted manifest integration
        run: python tools/check_phase9_integration.py --treeish e7311e3038bbfeebe15cc10004f40b3795811659

      - name: Run phase-10 local candidate review integration controls
        run: python -m unittest discover -s tests -p "test_phase10_integration.py" -v

      - name: Verify phase-10 zero-authority local review integration
        run: python tools/check_phase10_integration.py --treeish e7311e3038bbfeebe15cc10004f40b3795811659

      - name: Run phase-11 Phase10 review-shape closure controls
        run: python -m unittest discover -s tests -p "test_phase11_integration.py" -v

      - name: Verify phase-11 exact native review-shape closure
        run: python tools/check_phase11_integration.py --treeish e7311e3038bbfeebe15cc10004f40b3795811659

      - name: Run phase-12 current-master integration controls
        run: python -m unittest discover -s tests -p "test_phase12_integration.py" -v

      - name: Verify phase-12 current-master integration boundary
        run: python tools/check_phase12_integration.py --treeish 990906b6ea861ca579e1336bcfe8f17dd80c83ae

      - name: Run phase-13 DNG installation-evidence publication controls
        run: python -m unittest discover -s tests -p "test_phase13_integration.py" -v

      - name: Verify phase-13 DNG installation evidence without adoption credit
        run: python tools/check_phase13_integration.py --treeish eca6e364cf03e388f0416e3f8e80fe4091321aa0

      - name: Run phase-14 MLV task-definition publication controls
        run: python -m unittest discover -s tests -p "test_phase14_integration.py" -v

      - name: Verify phase-14 MLV task-definition evidence without adoption credit
        run: python tools/check_phase14_integration.py --treeish 95df488b2e2ec7120e992c0043d54b8e67a65dba

      - name: Run phase-15 MLV prelaunch-boundary publication controls
        run: python -m unittest discover -s tests -p "test_phase15_integration.py" -v

      - name: Verify phase-15 MLV prelaunch evidence without adoption credit
        run: python tools/check_phase15_integration.py --treeish 488538ca15676823681e241f6be848de1d30a291

      - name: Run phase-16 Phase 15 review-publication controls
        run: python -m unittest discover -s tests -p "test_phase16_integration.py" -v

      - name: Verify phase-16 Phase 15 review publication without adoption credit
        run: python tools/check_phase16_integration.py --treeish 8149c3f06811f85b833b28940017f2d05448cf5d

      - name: Run Phase 12-16 descendant event-scope controls
        run: python -m unittest discover -s tests -p "test_phase12_phase16_descendant_scope.py" -v

      - name: Verify frozen Phase 12-16 publications before descendant event scope
        run: python tools/check_phase12_phase16_descendant_scope.py

      - name: Run frozen adoption-ledger controls
        run: python -m unittest discover -s tests -p "test_adoption_ledger.py" -v

      - name: Reverify the frozen adoption ledger
        run: python tools/check_adoption_ledger.py --treeish HEAD

name: R26 project disposition intake

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r26-disposition-intake-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidence:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Check out full evidence history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run phase-2 blocker controls
        run: python -m unittest discover -s tests -p "test_phase2_disposition_batch.py" -v

      - name: Verify phase-2 blockers against frozen project evidence
        run: python tools/check_phase2_disposition_batch.py --treeish HEAD

      - name: Reverify the frozen adoption ledger
        run: python tools/check_adoption_ledger.py --treeish HEAD

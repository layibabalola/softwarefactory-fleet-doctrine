name: Account parity tooling

# Raised in fleet review of _bus #69: the hermetic suite must not be able to go
# silently unrun. R26 evidence runs the adoption-ledger suite, not this file, so the
# parity tooling needed its own path.
#
# WINDOWS ONLY, deliberately. The surfaces under test are Windows paths
# (%APPDATA%\Claude\config.json, ~/.claude.json), and the specific trap the suite
# exists to guard -- Path.home() following USERPROFILE and ignoring HOME -- is Windows
# behaviour that a POSIX runner cannot exercise. A ubuntu cell is not included because
# it was not verified before this workflow was written; adding a green that nobody has
# watched pass is how a suite becomes decorative. Add the cell after running it.

on:
  pull_request:
    paths:
      - ".github/workflows/account-parity.yml"
      - "tools/check-account-parity.py"
      - "tools/realign-cli.py"
      - "tests/test_account_parity.py"
      - "ruling-candidates/cli-parity-detection-vs-repair-r1.md"
  push:
    branches: [master]
    paths:
      - ".github/workflows/account-parity.yml"
      - "tools/check-account-parity.py"
      - "tools/realign-cli.py"
      - "tests/test_account_parity.py"
      - "ruling-candidates/cli-parity-detection-vs-repair-r1.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: account-parity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity-suite:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      # The suite is hermetic by construction: it sandboxes HOME and APPDATA, proves the
      # redirection in a child process before running anything, scrubs PATH so a stray
      # `claude` cannot resolve, and hashes the runner's own credential-shaped files
      # before and after. On a hosted runner there are no real credentials to protect --
      # the point of running it here is that the sandbox machinery itself stays honest.
      - name: Run the account-parity suite
        run: python -m unittest discover -s tests -p "test_account_parity.py" -v

      # A suite that cannot fail proves nothing. This asserts the assertions bite: with
      # the MATCHED-branch learn() removed, the prefill tests MUST go red. If this step
      # succeeds, the suite is vacuous and the build fails.
      - name: Prove the suite is not vacuous
        shell: bash
        run: |
          cp tools/check-account-parity.py /tmp/parity.bak
          python - <<'EOF'
          import pathlib
          p = pathlib.Path("tools/check-account-parity.py")
          s = p.read_text(encoding="utf-8")
          assert "        learn(c_fp, c_email)\n" in s, "anchor missing; update this guard"
          p.write_text(s.replace("        learn(c_fp, c_email)\n", "", 1), encoding="utf-8")
          EOF
          if python -m unittest discover -s tests -p "test_account_parity.py" > /dev/null 2>&1; then
            echo "FAIL: suite still passed with learn() removed - the assertions are vacuous"
            cp /tmp/parity.bak tools/check-account-parity.py
            exit 1
          fi
          echo "OK: removing learn() turns the suite red, as it must"
          cp /tmp/parity.bak tools/check-account-parity.py
